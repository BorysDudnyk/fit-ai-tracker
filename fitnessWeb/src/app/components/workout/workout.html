<div>
  <div nz-row>
    <h1 nz-card-grid [ngStyle]="gridStyle">Тренування</h1>
  </div>

  <div nz-row>
    <div nz-col nzFlex="2">
      <nz-card nzType="inner" style="margin-top: 16px;" nzTitle="Додати нове тренування">
        <form nz-form [formGroup]="workoutForm" (ngSubmit)="submitForm()" class="custom-form">
          <nz-form-item>
            <nz-form-control nzErrorTip="Будь ласка, введіть калорії!">
              <input type="text" nz-input formControlName="caloriesBurned"
                     placeholder="Введіть кількість спалених калорій" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-control nzErrorTip="Будь ласка, введіть тривалість!">
              <input type="number" nz-input formControlName="duration" placeholder="Введіть тривалість" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-control nzErrorTip="Будь ласка, введіть дату!">
              <nz-date-picker style="width: 100%;" formControlName="date"></nz-date-picker>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-control nzErrorTip="Будь ласка, виберіть тип!">
              <nz-select nzAllowClear nzPlaceHolder="Виберіть тип" formControlName="type">
                <nz-option *ngFor="let type of listOfType"
                           [nzLabel]="type" [nzValue]="type"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>

          <button nz-button nzType="primary" nzBlock [disabled]="workoutForm.invalid" class="w-100">
            Додати тренування
          </button>
        </form>
      </nz-card>
    </div>

    <div nz-col nzFlex="3" style="margin-left: 20px;">
      <nz-card nzType="inner" style="margin-top: 16px;" nzTitle="Минулі тренування">
        <div nz-card-grid style="width: 100%;" *ngFor="let workout of filteredWorkouts">
          <div nz-col nzSpan="30">
            Калорії: <strong>{{workout.caloriesBurned}}</strong> -
            Тривалість: <strong>{{workout.duration}}</strong> -
            Дата: <strong>{{workout.date | date}}</strong> -
            Тип: <strong>{{workout.type}}</strong>
          </div>
        </div>

        <button nz-button nzType="default" (click)="toggleShowAll()" style="margin-top: 10px;">
          {{ showAll ? 'Показати лише останній тиждень' : 'Показати всі тренування' }}
        </button>
      </nz-card>
    </div>
  </div>
</div>
